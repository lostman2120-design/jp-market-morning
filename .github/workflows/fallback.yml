name: fallback
on:
  schedule:
    - cron: "30 22 * * 0-4"   # 07:30 JST 月〜金
  workflow_dispatch:
concurrency:
  group: jpmm
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
env:
  PAGE_URL: https://lostman2120-design.github.io/jp-market-morning/
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
jobs:
  fallback:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 理由ファイルがpushされていれば反映された最新版を、なければランキングのみを再デプロイ
      - name: Build page
        run: python scripts/build_page.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify (fallback)
        run: python scripts/notify.py --mode fallback
      - name: Commit notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "notified: fallback" || echo "nothing to commit"
          git pull --rebase
          git push
